name: Validate mod sources
on: [push, pull_request]
jobs:
  portraits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'Pillow>=11.1,<13'
      - run: python -m unittest discover -s tests -v
      - run: python mod_nailong/tools/audit_art.py
      - run: python mod_nailong/tools/build_release.py --preview --check
