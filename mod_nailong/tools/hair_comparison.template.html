<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>奶龙头像 · 发型与胡子对照</title>
<style>
:root{color-scheme:dark;font-family:"Microsoft YaHei UI",system-ui,sans-serif;background:#101814;color:#eef2e9}*{box-sizing:border-box}body{margin:0}header{padding:20px 30px 16px;border-bottom:1px solid #344337;display:flex;justify-content:space-between;align-items:center}h1{font-size:26px;margin:0 0 7px}p{margin:0;color:#b1bdad;font-size:13px;line-height:1.6}.badge{color:#d7e8a1;border:1px solid #697c39;border-radius:20px;padding:8px 14px;font-size:13px}main{display:grid;grid-template-columns:260px 1fr;max-width:1680px;margin:auto}aside{padding:18px 12px;max-height:calc(100vh - 100px);overflow:auto;border-right:1px solid #344337;position:sticky;top:0;align-self:start}button{font:inherit;color:inherit;background:#26352a;border:1px solid #4b614e;border-radius:7px;padding:9px 14px;cursor:pointer}button:hover,button:focus-visible{background:#3c513f;outline:2px solid #a8bd72}aside button{display:block;width:100%;text-align:left;font-size:12px;margin:0 0 6px;line-height:1.4}aside button[aria-current=true]{background:#526237;color:#fff;border-color:#b5c77d}.workspace{padding:18px 28px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.toolbar label{font-size:13px;margin-left:auto;cursor:pointer}h2{font-size:21px;margin:18px 0 4px}.meta{font-size:12px;color:#a1b19f;overflow-wrap:anywhere;min-height:35px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:15px}.card{border:1px solid #3b4c3f;border-radius:12px;overflow:hidden;background:#1c2820}.card h3{font-size:16px;margin:0;padding:12px 18px;background:#27352b}.card.new h3{background:#40512b;color:#f3f7c0}.stage{height:min(51vh,470px);min-height:250px;display:flex;align-items:center;justify-content:center;background-color:#303a31;background-image:linear-gradient(45deg,#3b453c 25%,transparent 25%),linear-gradient(-45deg,#3b453c 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#3b453c 75%),linear-gradient(-45deg,transparent 75%,#3b453c 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.stage img{height:90%;max-width:95%;object-fit:contain;image-rendering:auto}.native .stage img{height:auto;max-width:none;image-rendering:pixelated}.caption{font-size:12px;color:#b1bdad;padding:8px 18px}.notes{margin:12px 0;color:#a8b7a2;font-size:12px}details{border-top:1px solid #344337;padding:12px 0}summary{cursor:pointer;color:#d1dfb5;font-size:13px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:Consolas,monospace;font-size:12px;line-height:1.5;color:#c4cebd;background:#17211a;padding:15px;border-radius:6px}.prompts{display:grid;grid-template-columns:1fr 1fr;gap:20px}#overview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:20px}#overview[hidden]{display:none}.tile{padding:12px;background:#1c2820;border:1px solid #3b4c3f;border-radius:8px;cursor:pointer}.tile p{margin-bottom:7px;min-height:38px}.tile div{display:flex;justify-content:space-around;gap:8px}.tile img{height:150px;max-width:46%;object-fit:contain}.tile small{color:#b8c69c;font-size:11px}.error{color:#ffb4a0}footer{font-size:11px;color:#869680;margin:18px 0}@media(max-width:900px){main{display:block}aside{display:none}.workspace{padding:15px}.stage{min-height:180px;height:38vh}.pair{gap:10px}#overview{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:15px}.badge{display:none}}
</style>
<header><div><h1>奶龙头像：发型与胡子对照</h1><p>26 个资源实例 · 23 张不同原图 · 左旧版 / 右新版</p></div><span class="badge">已采用：保留原人物毛发特征</span></header>
<main><aside id="list" aria-label="全部头像"></aside><section class="workspace">
<div class="toolbar"><button id="prev">← 上一张</button><span id="count"></span><button id="next">下一张 →</button><button id="grid">查看全部对照</button><label><input id="native" type="checkbox"> 原始尺寸</label></div>
<div id="focus"><h2 id="name"></h2><div class="meta" id="meta"></div>
<div class="pair"><article class="card"><h3>A · 上次生成的旧版</h3><div class="stage"><img id="a" alt="旧版奶龙头像"></div><div class="caption">旧版基线：未保留人物毛发</div></article>
<article class="card new"><h3>B · 保留发型、胡子等特征的新版</h3><div class="stage"><img id="b" alt="新版奶龙头像"></div><div class="caption">已选方案：原图可见的毛发特征 + 黄色奶龙本体</div></article></div>
<p class="notes" id="shared"></p><details><summary>展开两版完整 prompt</summary><div class="prompts"><div><h3>A · 完整 prompt</h3><pre id="pa"></pre></div><div><h3>B · 完整 prompt</h3><pre id="pb"></pre></div></div></details></div>
<div id="overview" hidden></div><footer>左右方向固定。可用键盘 ← / → 切换。原始尺寸按图片像素显示；放大查看不会增加原图细节。生成编辑具有随机性，衣服、光影和轮廓可能轻微变化。</footer>
</section></main>
<script>
const rows=__COMPARISON_DATA__;
let current=0;const $=id=>document.getElementById(id);const buttons=[];
rows.forEach((row,i)=>{const button=document.createElement('button');button.textContent=`${String(i+1).padStart(2,'0')}  ${row.title}`;button.onclick=()=>{show(i);$('overview').hidden=true;$('focus').hidden=false;};$('list').append(button);buttons.push(button);
 const tile=document.createElement('article');tile.className='tile';tile.tabIndex=0;const title=document.createElement('p');title.textContent=`${i+1}. ${row.title}`;tile.append(title);const pair=document.createElement('div');['a','b'].forEach(side=>{const im=document.createElement('img');im.src=row[side];im.alt=side==='a'?'左：旧版':'右：新版';pair.append(im);});tile.append(pair);const label=document.createElement('small');label.textContent='← A 旧版　 |　 B 新版 →';tile.append(label);tile.onclick=()=>{show(i);$('overview').hidden=true;$('focus').hidden=false;window.scrollTo(0,0);};tile.onkeydown=e=>{if(e.key==='Enter')tile.click();};$('overview').append(tile);
});
function show(i){current=(i+rows.length)%rows.length;const r=rows[current];$('count').textContent=`${current+1} / ${rows.length}`;$('name').textContent=r.title;$('meta').textContent=`${r.size.join(' × ')} px · ${r.package} · ${r.source}`;for(const side of ['a','b']){$(side).src=r[side];$(side).onerror=()=>{$('meta').textContent='图片加载失败，请检查本地文件。';$('meta').classList.add('error');};}$('pa').textContent=r.promptA;$('pb').textContent=r.promptB;$('shared').textContent=r.shared>1?`该原图用于 ${r.shared} 个资源实例，原始 SHA 完全相同，因此共用同一份生成结果。`:'此原图独立生成新版。';buttons.forEach((b,n)=>b.setAttribute('aria-current',String(n===current)));}
$('prev').onclick=()=>show(current-1);$('next').onclick=()=>show(current+1);$('native').onchange=e=>$('focus').classList.toggle('native',e.target.checked);$('grid').onclick=()=>{const visible=$('overview').hidden;$('overview').hidden=!visible;$('focus').hidden=visible;$('grid').textContent=visible?'返回单张对照':'查看全部对照';};document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowLeft'){$('prev').click();e.preventDefault();}if(e.key==='ArrowRight'){$('next').click();e.preventDefault();}});show(0);
</script></html>
